services:
  rabovel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rabovel
    restart: unless-stopped
    tty: true
    # No public port here -- the WAF (below) is the only path a client
    # request can take to reach this service. It's still reachable from
    # other containers on the compose network at rabovel:8080.
    expose:
      - "8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: rabovel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rabovel-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # bitnami/kafka is no longer published on Docker Hub under its old free
    # tags -- this is the official Apache Kafka image (KRaft mode, no
    # ZooKeeper needed), config shape taken from apache/kafka's own
    # single-node KRaft docker-compose example.
    image: apache/kafka:3.8.0
    container_name: rabovel-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:19092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is what every other container on this network uses
      # (matches KAFKA_BOOTSTRAP_SERVERS=kafka:9092 in .env); PLAINTEXT_HOST
      # is only for reaching Kafka from the host machine for debugging.
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:9092,PLAINTEXT_HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: rabovel-waf
    restart: unless-stopped
    environment:
      BACKEND: "http://rabovel:8080"
      PARANOIA: "${WAF_PARANOIA_LEVEL:-1}"
      ANOMALY_INBOUND: "5"
      SERVER_NAME: "rabovel"
    ports:
      - "3000:8080"
    depends_on:
      rabovel:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  kafka_data:
