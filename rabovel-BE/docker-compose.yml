services:
  postgres:
    image: postgres:16-alpine
    container_name: rabovel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rabovel-redis
    restart: unless-stopped
    # Match the hosted 25 MB security-state store; TTL expiration continues.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 25mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # On-demand Rust test runner on the same toolchain as the Dockerfile/CI.
  # Only starts when invoked explicitly (profile "test"), e.g.:
  #   docker compose run --rm tests
  #   docker compose run --rm tests cargo test --workspace --locked
  # Source is bind-mounted; registry and build output live in named volumes
  # so the Linux target dir never collides with a host-side Windows build.
  tests:
    image: rust:1.98-slim-bookworm
    profiles: ["test"]
    working_dir: /app
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target:/app/target
    command: ["cargo", "test", "-p", "matching-engine", "--locked"]

volumes:
  postgres_data:
  redis_data:
  cargo_registry:
  cargo_target:
