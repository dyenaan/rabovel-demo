[package]
name = "rabovel-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
domain = { path = "../../crates/domain" }
events = { path = "../../crates/events" }
infrastructure = { path = "../../crates/infrastructure" }
identity = { path = "../../crates/identity" }
kyc = { path = "../../crates/kyc" }
portfolio-trading = { path = "../../crates/portfolio-trading" }
solana-adapter = { path = "../../crates/solana-adapter" }
async-trait = { workspace = true }
argon2 = "0.5"
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
ed25519-dalek = "2.2"
axum = "0.7"
getrandom = "0.2"
hex = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
solana-client = "3.1.10"
solana-commitment-config = "3.1.0"
solana-instruction = "3.1.0"
solana-keypair = "3.1.0"
solana-message = "3.1.0"
solana-pubkey = "3.0.0"
solana-signer = "3.0.0"
solana-transaction = { version = "3.1.0", features = ["bincode", "verify"] }
solana-system-interface = "3.2.0"
siwe = "0.6"
spl-associated-token-account-interface = "2.0.0"
spl-token-2022 = { version = "11.0.0", features = ["no-entrypoint"] }
token-acl-client = "=0.3.1"
time = { version = "0.3", features = ["formatting"] }
tokio = { workspace = true }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
utoipa = { version = "4", features = ["axum_extras"] }
