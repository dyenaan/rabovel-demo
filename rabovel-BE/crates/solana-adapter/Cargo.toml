[package]
name = "solana-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
async-trait.workspace = true
token-acl-interface = "=0.3.1"
spl-tlv-account-resolution = "=0.11.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
solana-client = "3.1.10"
solana-commitment-config = "3.1.0"
solana-instruction = "3.1.0"
solana-keypair = "3.1.0"
solana-message = "3.1.0"
solana-pubkey = "3.0.0"
solana-signer = "3.0.0"
solana-transaction = "3.1.0"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
spl-token-2022 = { version = "11.0.0", features = ["no-entrypoint"] }
spl-token-metadata-interface = "1.0.1"
token-acl-client = "=0.3.1"

[dev-dependencies]
uuid = { version = "1.18.1", features = ["v4"] }
