name: AI Build Triage

# Fires when a ticket gets the `ai-build` label. Validates the spec is complete
# enough for an agent to run, then posts the hand-off pack (builder + reviewer
# prompts) as a comment. It does NOT write code: the builder is a
# subscription-powered agent (Codex cloud / OpenCode / Muse Code) that the
# ticket is handed to next. See docs/agent-pipeline/README.md.

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  triage:
    if: github.event.label.name == 'ai-build'
    runs-on: ubuntu-latest
    steps:
      - name: Validate spec and post hand-off pack
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const checks = [
              { name: 'Acceptance criteria present', ok: /acceptance criteria/i.test(body) },
              { name: 'Tests / evals listed', ok: /tests \/ evals/i.test(body) },
              { name: 'Risk classified', ok: /risk/i.test(body) },
            ];
            const missing = checks.filter(c => !c.ok).map(c => c.name);
            const lines = [];
            lines.push('## 🤖 Agent pipeline — triage');
            lines.push('');
            for (const c of checks) lines.push(`- ${c.ok ? '✅' : '❌'} ${c.name}`);
            lines.push('');
            if (missing.length) {
              lines.push('**Ticket bounced.** Fill in the missing sections above (edit the issue, the label is already set) and this pack will re-run on the next label event. An agent cannot run on an incomplete spec — that is the main source of silent wrong behaviour.');
            } else {
              lines.push('**Spec complete.** Hand-off order:');
              lines.push('');
              lines.push('1. **Planner** — break this ticket into one small vertical slice (repo rule: one slice per session). If the ticket is bigger than one slice, split it into sub-issues and stop.');
              lines.push('2. **Builder** — hand the ticket to Codex (assign the issue / `@codex`) or run OpenCode on it. Builder must follow `AGENTS.md` in the target area and load only the applicable `.agents/skills/` workflow (`plan-feature` → `implement-slice`).');
              lines.push('3. **Tests** — PR must keep CI green: BE runs fmt/clippy/`cargo test`; FE runs the node tests in `rabovel-FE/tests/`.');
              lines.push('4. **Reviewer (second AI, different model than the builder)** — score the PR against `docs/agent-pipeline/REVIEW_RUBRIC.md` and post the scored review as a PR comment. No merge without a passing rubric score.');
              lines.push('5. **Human gate** — merge to staging behind a feature flag. Production promotion is a human decision; `high` risk tickets never auto-promote.');
              lines.push('');
              lines.push('Quota check before starting: see `docs/agent-pipeline/QUOTA.md` — if the builder or reviewer subscription is capped, park this ticket with the `quota-wait` label instead of burning API credits.');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: lines.join('\n'),
            });
